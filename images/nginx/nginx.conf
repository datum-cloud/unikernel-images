# Single-process configuration: the unikernel runs exactly one process, so the
# master/worker split and daemonising are turned off.
worker_processes  1;
daemon            off;
master_process    off;
user root root;

events {
  worker_connections  64;
}

http {
  include mime.types;
  default_type application/octet-stream;

  open_file_cache           max=10000 inactive=30s;
  open_file_cache_min_uses  2;
  open_file_cache_errors    on;

  error_log stderr error;
  access_log off;

  keepalive_timeout     10s;
  keepalive_requests    10000;
  send_timeout          10s;

  server {
    # Datum compute networks are IPv6-only, so an IPv4-only listener is
    # unreachable. nginx keeps ipv6only=on for [::] sockets, so both listen
    # directives are needed to accept IPv6 and IPv4.
    listen              8080;
    listen              [::]:8080;
    server_name         localhost;
    root                /wwwroot;
    index               index.html;
  }
}
