# Listen on every IPv4 and IPv6 address: Datum compute networks are
# IPv6-only. The '-' prefix keeps startup from failing if a family is absent.
bind * -::*
port 6379
tcp-backlog 511
daemonize no
timeout 0
tcp-keepalive 300

# The rootfs lives in RAM and is discarded on stop, so persistence is off.
appendonly no
save ""
dir /data
