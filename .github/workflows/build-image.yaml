name: build-image

# Shared pipeline for one image, called by .github/workflows/<image>.yaml.
#
# On a pull request the image is built and verified only. On any other event
# (push to main, schedule, workflow_dispatch) that runs on main, it is also
# pushed to ghcr.io/datum-cloud/unikernel/<image> under every tag listed in
# images/<image>/image.yaml.
#
# Pulling the base/base-compat runtimes needs index.unikraft.io credentials
# allowed to read official/*; the caller passes them with `secrets: inherit`.

on:
  workflow_call:
    inputs:
      image:
        description: "Directory name under images/"
        required: true
        type: string
    secrets:
      UNIKRAFT_INDEX_USER:
        required: true
      UNIKRAFT_INDEX_TOKEN:
        required: true

env:
  KRAFT_VERSION: "0.12.11"
  CRANE_VERSION: "v0.20.6"
  KRAFTKIT_NO_CHECK_UPDATES: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read image metadata
        id: meta
        run: |
          set -eu
          source hack/lib.sh
          version="$(image_meta "${{ inputs.image }}" version)"
          tags="$(image_meta "${{ inputs.image }}" tags)"
          [[ -n "$version" ]] || die "images/${{ inputs.image }}/image.yaml has no version"
          [[ " $tags " == *" $version "* ]] || die "tags must include the upstream version $version (got: $tags)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ inputs.image }} $version -> tags: $tags"

      - name: Install kraft and crane
        run: |
          set -eu
          curl -sSfL "https://github.com/unikraft/kraftkit/releases/download/v${KRAFT_VERSION}/kraft_${KRAFT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kraft
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          kraft version
          crane version

      - name: Start BuildKit
        run: docker run -d --name buildkit --privileged moby/buildkit:latest

      - name: Log in to index.unikraft.io
        env:
          INDEX_USER: ${{ secrets.UNIKRAFT_INDEX_USER }}
          INDEX_TOKEN: ${{ secrets.UNIKRAFT_INDEX_TOKEN }}
        run: |
          set -eu
          if [[ -z "$INDEX_USER" || -z "$INDEX_TOKEN" ]]; then
            echo "::error::UNIKRAFT_INDEX_USER / UNIKRAFT_INDEX_TOKEN are not set; the base runtimes cannot be pulled"
            exit 1
          fi
          kraft login index.unikraft.io --user "$INDEX_USER" --token "$INDEX_TOKEN"

      - name: Build
        run: hack/build.sh "${{ inputs.image }}"

      - name: Verify
        run: hack/verify.sh "${{ inputs.image }}"

      - name: Upload OCI layout
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.image }}-${{ steps.meta.outputs.version }}
          path: dist/*.tar
          retention-days: 7

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: hack/push.sh "${{ inputs.image }}"
