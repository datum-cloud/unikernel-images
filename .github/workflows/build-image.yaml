name: build-image

# Shared pipeline for one image, called by .github/workflows/<image>.yaml.
#
# On a pull request the image is built and verified only. On any other event
# (push to main, schedule, workflow_dispatch) that runs on main, it is also
# pushed to ghcr.io/datum-cloud/unikernel/<image> under every tag listed in
# images/<image>/image.yaml.
#
# Images are built with the datumctl compute plugin, which only needs the
# runner's Docker (for BuildKit) and no registry credentials of its own.

on:
  workflow_call:
    inputs:
      image:
        description: "Directory name under images/"
        required: true
        type: string

env:
  DATUMCTL_COMPUTE_VERSION: "v0.11.1"
  CRANE_VERSION: "v0.20.6"
  BUILDKIT_IMAGE: "moby/buildkit:v0.33.1"
  # The plugin needs BuildKit's OCI exporter, which the runner's Docker-embedded
  # BuildKit does not offer, so a standalone buildkitd serves the build.
  BUILDKIT_HOST: "tcp://127.0.0.1:1234"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read image metadata
        id: meta
        run: |
          set -eu
          source hack/lib.sh
          version="$(image_meta "${{ inputs.image }}" version)"
          tags="$(image_meta "${{ inputs.image }}" tags)"
          loader="$(image_meta "${{ inputs.image }}" loader)"
          [[ -n "$version" ]] || die "images/${{ inputs.image }}/image.yaml has no version"
          [[ "$loader" == static || "$loader" == dynamic ]] || die "image.yaml loader must be static or dynamic (got '$loader')"
          [[ " $tags " == *" $version "* ]] || die "tags must include the upstream version $version (got: $tags)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ inputs.image }} $version -> tags: $tags"

      - name: Install datumctl-compute, crane, and erofs-utils
        run: |
          set -eu
          curl -sSfL "https://github.com/datum-cloud/compute/releases/download/${DATUMCTL_COMPUTE_VERSION}/datumctl-compute_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin datumctl-compute
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends erofs-utils
          datumctl-compute build --help >/dev/null
          crane version
          fsck.erofs -V

      - name: Start BuildKit
        run: |
          set -eu
          docker run -d --name buildkit --privileged -p 127.0.0.1:1234:1234 "$BUILDKIT_IMAGE" --addr tcp://0.0.0.0:1234
          for _ in $(seq 1 30); do
            docker exec buildkit buildctl --addr tcp://127.0.0.1:1234 debug workers >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs buildkit
          echo "::error::buildkitd did not become ready"
          exit 1

      - name: Build
        run: hack/build.sh "${{ inputs.image }}"

      - name: Verify
        run: hack/verify.sh "${{ inputs.image }}"

      - name: Upload OCI archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.image }}-${{ steps.meta.outputs.version }}
          path: dist/*.tar
          retention-days: 7

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: hack/push.sh "${{ inputs.image }}"
