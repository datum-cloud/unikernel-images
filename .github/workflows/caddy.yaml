name: caddy

on:
  pull_request:
    paths:
      - "images/caddy/**"
      - "hack/**"
      - ".github/workflows/build-image.yaml"
      - ".github/workflows/caddy.yaml"
  push:
    branches: [main]
    paths:
      - "images/caddy/**"
      - "hack/**"
      - ".github/workflows/build-image.yaml"
      - ".github/workflows/caddy.yaml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    with:
      image: caddy
    secrets: inherit
